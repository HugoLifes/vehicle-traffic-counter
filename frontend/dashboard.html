<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aforo Vehicular — Cámara en vivo</title>
<link rel="stylesheet" href="css/fonts.css?v=5">
<link rel="stylesheet" href="css/tokens.css?v=5">
<link rel="stylesheet" href="css/shared.css?v=5">
<link rel="stylesheet" href="css/dashboard.css?v=5">
</head>
<body>
<div class="wrap">

  <div id="nav-host"></div>
  <div id="guia-host"></div>

  <div class="status-row" id="status-bar">
    <span class="pill">Cargando estado…</span>
  </div>

  <div class="stat-cluster">
    <div class="stat-tile accent">
      <div class="label">Total</div>
      <div class="value" id="hero-total">0</div>
    </div>
    <div class="stat-tile">
      <div class="label">Entrada</div>
      <div class="value" id="hero-in">0</div>
    </div>
    <div class="stat-tile">
      <div class="label">Salida</div>
      <div class="value" id="hero-out">0</div>
    </div>
    <div class="stat-tile">
      <div class="label">Flujo neto</div>
      <div class="value" id="hero-net">0</div>
    </div>
  </div>

  <h2 class="section-title">Carriles</h2>
  <div class="lane-grid" id="lane-grid">
    <div class="empty-state">Cargando carriles…</div>
  </div>

</div>

<script src="vendor/gsap.min.js"></script>
<script src="js/nav.js?v=5"></script>
<script>
  renderNav({ current: 'dashboard', title: 'Cámara en vivo',
              subtitle: 'Conteo en tiempo real — sin grabación de video' });
</script>
<script src="js/theme.js?v=5"></script>
<script src="js/dashboard.js?v=5"></script>
<script src="js/guia.js?v=5"></script>
</body>
</html>
