# Configuración de las APIs de NVIDIA (build.nvidia.com / NIM).
#
# La API key NUNCA va aquí — se lee de la variable de entorno
# NVIDIA_API_KEY (ver .env.example). Este archivo solo fija qué
# modelo se usa para cada rol.
#
# Modelos confirmados funcionando en la cuenta gratuita real del
# proyecto (probados con curl contra integrate.api.nvidia.com el
# 2026-08-28). El catálogo de NVIDIA cambia con el tiempo y esta
# cuenta en particular solo tiene habilitado un subconjunto — si un
# modelo empieza a fallar con 404, hay que revisar
# https://build.nvidia.com para ver qué está disponible ahora.

base_url: "https://integrate.api.nvidia.com/v1"

models:
  # IA validadora (sanity-check de conteos) y generación de respuestas del
  # RAG.
  #
  # Era meta/llama-3.2-90b-vision-instruct, que dejó de responder: el
  # catálogo de la cuenta cambió y ese modelo ya solo da timeouts, mientras
  # que llama-3.1-8b y llama-3.3-70b devuelven 410 Gone. Se probaron los 55
  # modelos de texto del catálogo: solo 12 responden.
  #
  # De esos 12, este es el que sirve para RAG. Medido con un prompt real de
  # dos fuentes citadas: responde en 3.0 s, en español, y respeta las citas
  # [1] [2]. Los descartados y por qué:
  #   nemotron-3.5-lightning  - filtra su razonamiento interno en inglés
  #   openai/gpt-oss-20b      - ignora el idioma pedido
  #   moonshotai/kimi-k3      - correcto pero 3 veces más lento (10.5 s)
  #
  # 24-oct-2026: nemotron-3-super-120b dejó de responder (404 "Function not
  # found for account") aunque /v1/models lo sigue listando: estar en la
  # lista no garantiza que conteste. Probado con una pregunta de RAG real
  # (dos fuentes, FHP + un caso de la plataforma), sin razonamiento:
  #   nemotron-3.5-super-vl-120b  2.1 s, correcto, cita cada frase  <- este
  #   nemotron-3.5-lightning-30b  1.4 s, correcto, citas al final    <- respaldo
  #   openai/gpt-oss-20b          13 s, fórmulas en LaTeX
  #   gemma-4-31b, deepseek-v4.1-flash: timeout a 90 s
  #   nemotron-nano-3, mistral-large-2, llama-3.1-nemotron-70b: 404
  # Los dos de 3.5 son de razonamiento: con el razonamiento encendido tardan
  # 4-9 s y gastan cientos de tokens pensando; `chat_extra` lo apaga.
  chat: "nvidia/nemotron-3.5-super-vl-120b-a12b"

  # Si el modelo de chat da 404 (lo retiraron), se prueba el siguiente sin
  # reintentar el que ya no existe: así un cambio del catálogo no tumba el RAG
  # hasta que alguien lo note, que es lo que pasó el 24-oct.
  chat_respaldo:
    - "nvidia/nemotron-3.5-lightning-30b-a3b"

  # IA visual: contexto cualitativo de la escena (congestión, sentido
  # contrario, clima). Versión más chica/rápida para llamadas periódicas.
  vision: "meta/llama-3.2-11b-vision-instruct"

  # Clase del vehículo sobre su recorte (tools/revisar_pesados.py). Medido
  # el 24-sep-2026 contra etiquetas hechas a ojo en el aforo frontal de
  # Cd. Juárez: livianos 60/60 a las 18 h y 72/73 a las 13 h (auto,
  # camioneta, pickup, pesado, moto); pesados 126/136 de día, tarde y noche
  # (autobús 69/71, tractocamión 25/26; los fallos restantes son respuestas
  # vacías). 2.5 s por recorte. llama-3.2-90b-vision da timeout, gemma-3 y
  # cosmos-reason2 dan 404, llama-4-maverick 410; kimi-k3 contesta pero
  # tarda 42 s y acertó 27/33.
  #
  # 24-oct-2026: se cambia a nemotron-3.5-super-vl. Medido sobre 76 recortes
  # de data/nuevos/clasif_pesados (las 5 clases, día 12-17 h y noche 19-23 h),
  # mirando a ojo cada desacuerdo (2 eran de la etiqueta, no del modelo):
  #   nano-omni (el anterior)  ~66/76 (87 %), 1.7 s; ya devolvía respuestas
  #                            VACÍAS en 6 de 16 tractores sin caja, y 503s
  #   super-vl-120b            ~73/76 (96 %), 0.9 s; día 39/40, noche 32/36
  #   llama-3.2-11b-vision     llamó "auto" a 5 de 16 autobuses, 17 s
  #   deepseek-v4.1-flash      timeout a 90 s en todos
  # Sus 3 fallos: un tractor sin caja de espaldas (dijo tractocamión), una
  # pickup con redilas (camión) y un auto delante de una caja blanca.
  # Las etiquetas YA APLICADAS al proyecto 7 son del modelo anterior; no se
  # tocan. El nuevo vale para revisiones nuevas.
  clasificacion: "nvidia/nemotron-3.5-super-vl-120b-a12b"
  clasificacion_respaldo:
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

  # Embeddings para el RAG (2048 dimensiones)
  embedding: "nvidia/nemotron-3-embed-1b"

  # Reranking: el endpoint dedicado (/v1/ranking) no resuelve en esta
  # cuenta todavía (404 de ruta, no de permisos) — pendiente de revisar.
  # Mientras tanto el RAG usa fusión híbrida (denso + léxico + RRF) sin
  # paso de reranking, que sigue siendo un patrón de retrieval válido.
  reranking: null

# Límites/comportamiento
request_timeout_s: 30

# El RAG manda seis fragmentos de contexto y pide cientos de tokens: con
# 30 s se agota siempre. Medido contra la API real desde México.
rag_timeout_s: 120
max_retries: 2

# Campos extra para las llamadas de chat y de visión. Apaga el razonamiento de los
# modelos 3.5: la respuesta del RAG sale igual de correcta en la mitad del
# tiempo (medido arriba).
chat_extra:
  chat_template_kwargs:
    enable_thinking: false
# A qué modelos se les manda `chat_extra`: solo a los que lo aceptan.
sin_razonamiento:
  - "nvidia/nemotron-3.5-super-vl-120b-a12b"
  - "nvidia/nemotron-3.5-lightning-30b-a3b"

# Intervalos de las IAs periódicas (segundos) — no llamar la API en
# cada frame, el free tier es rate-limited.
visual_interval_s: 20
