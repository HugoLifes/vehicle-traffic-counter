# Configuración de la plataforma (backend + dashboard).
# Para procesar un video puntual con reportes, usa main.py + configs/default_config.yaml.

# Fuente de la cámara: índice de webcam ("0"), ruta a archivo, o rtsp://...
# Se puede sobreescribir sin editar este archivo con la variable de entorno CAMERA_SOURCE.
camera_source: "0"

# yolov8s en vez de yolov8n. Medido sobre 2 min del footage real, con el
# resto de la configuración idéntico: 75 -> 107 cruces contados. El modelo
# "n" simplemente no ve los vehículos de esta escena; ver docs/DETECCION.md.
# yolov8m se probó también y da 108 — un cruce más al doble de costo.
model_path: "models/yolov8s.pt"
# 0.25 es el umbral documentado en la Publicación Técnica 914 del IMT para
# esta misma aplicación (ver docs/METODOLOGIA_IMT.md). Medido sobre el
# footage real de este proyecto: pasa de 0.53 a 0.88 detecciones por cuadro
# (+66%) y de 54 a 78 cruces contados en 2 min, sin costo de velocidad.
confidence_threshold: 0.25
device: "auto"

detector:
  # NMS. La PT-914 documenta 0.7, pero medido sobre ESTE footage 0.7 deja
  # 29% más cajas duplicadas sobre el mismo vehículo (107 vs 83 pares muy
  # solapados) a cambio de solo 2% más detecciones reales — y cada caja
  # duplicada puede convertirse en un track extra y un conteo de más.
  iou_threshold: 0.5
  # 1280 y no 640. El video es de 640x360 y el vehículo mide 13-18 px de
  # alto: a imgsz 640 el modelo no tiene con qué resolverlo. Subirlo solo
  # es asequible gracias a la banda de abajo.
  input_size: 1280

  # Detectar solo en la franja donde están los carriles calibrados, en vez
  # de en todo el cuadro. En este encuadre más de la mitad de la imagen es
  # terreno sin tránsito, y gastar imgsz en él es lo que dejaba al vehículo
  # sin píxeles. Medido: mismos cruces que el cuadro completo a 1280
  # (107 vs 110) en un tercio del tiempo (56 vs 153 ms por cuadro).
  #
  # El margen se toma sobre el alto del cuadro y es deliberadamente amplio:
  # un tráiler cerca de la cámara es mucho más alto que la línea de conteo,
  # y recortar a ras de la línea perdería justo el vehículo grande.
  band:
    enabled: true
    margin_ratio: 0.15

  # Aceleración del Jetson. En una GPU de escritorio no hacen falta; en el
  # Orin Nano son lo que decide si el aforo se procesa en un tiempo útil.
  # TensorRT compila el modelo para ESA GPU concreta: la primera vez tarda
  # varios minutos y deja un .engine junto al .pt, que se reutiliza.
  #
  # Medido en la PC de desarrollo (RTX), imgsz 1280 sobre la franja:
  #   30.6 ms/cuadro -> 4.6 min por cada video de 10 min.
  # El Orin Nano es del orden de 5-8x más lento, así que sin TensorRT un
  # video de 10 min tardaría entre 23 y 37 minutos.
  use_tensorrt: false
  half_precision: false

tracker:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

server:
  host: "0.0.0.0"
  port: 8080
